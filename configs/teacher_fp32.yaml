# Pilot teacher — ResNet-18 (width 1.0), full fp32 training.
# Run once per seed:  python -m src.train --config configs/teacher_fp32.yaml --seed {0,1,2}
#
# NOTE: epochs reduced 200 -> 30 for the phase-1 signal check on CPU (teacher +
# w0.5 student, fp32, seeds {0,1}). The AMP configs stay at 200. Bump this back
# to 200 (or 100) once the flatness/OOD signal is confirmed.
mode: teacher
precision: fp32          # training-time only; geometry/eval are always fp32
seed: 0                  # overridden by --seed
results_dir: results
deterministic: true

model:
  arch: resnet18_cifar
  width_mult: 1.0
  num_classes: 10

data:
  dataset: cifar10
  data_dir: data
  batch_size: 128
  num_workers: 4

optim:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false

schedule:
  name: cosine
  epochs: 30           # phase-1 signal check on CPU; restore 200 for the full pilot
  warmup_epochs: 0

wandb:
  enabled: false
