# Teacher, ResNet-18 width 1.0, fp32.
#   python -m src.train --config configs/teacher_fp32.yaml --seed {0,1,2,3,4}

mode: teacher
precision: fp32
seed: 0
results_dir: results
deterministic: true

model:
  arch: resnet18_cifar
  width_mult: 1.0
  num_classes: 10

data:
  dataset: cifar10
  data_dir: data
  batch_size: 128
  num_workers: 4

optim:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false

schedule:
  name: cosine
  epochs: 200
  warmup_epochs: 0

wandb:
  enabled: false
