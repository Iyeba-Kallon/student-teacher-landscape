# Pilot teacher — ResNet-18 (width 1.0), full fp32 training.
# Run once per seed:  python -m src.train --config configs/teacher_fp32.yaml --seed {0,1,2}
#
# NOTE: epochs reduced 200 -> 100 for the reduced CPU pilot (phase 1). The AMP
# configs stay at 200; bump this back to 200 for the full GPU pilot so fp32 and
# AMP share the same training budget.
mode: teacher
precision: fp32          # training-time only; geometry/eval are always fp32
seed: 0                  # overridden by --seed
results_dir: results
deterministic: true

model:
  arch: resnet18_cifar
  width_mult: 1.0
  num_classes: 10

data:
  dataset: cifar10
  data_dir: data
  batch_size: 128
  num_workers: 4

optim:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false

schedule:
  name: cosine
  epochs: 100          # reduced CPU pilot (phase 1); 200 for the full GPU pilot
  warmup_epochs: 0

wandb:
  enabled: false
