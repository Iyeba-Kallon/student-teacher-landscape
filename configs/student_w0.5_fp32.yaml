# Pilot student — ResNet-18 width 0.5, distilled in fp32 from the fp32 teacher.
# The teacher checkpoint is resolved per-run: {precision} and {seed} are filled
# in from this run's precision/seed, so `--seed 1` distills from teacher seed 1.
# Run once per seed:  python -m src.train --config configs/student_w0.5_fp32.yaml --seed {0,1,2}
#
# NOTE: epochs reduced 200 -> 100 for the reduced CPU pilot (phase 1). Keep the
# teacher at the same budget; restore 200 for the full GPU pilot.
mode: student
precision: fp32
seed: 0
results_dir: results
deterministic: true

model:
  arch: resnet18_cifar
  width_mult: 0.5
  num_classes: 10

data:
  dataset: cifar10
  data_dir: data
  batch_size: 128
  num_workers: 4

optim:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false

schedule:
  name: cosine
  epochs: 100          # reduced CPU pilot (phase 1); 200 for the full GPU pilot
  warmup_epochs: 0

kd:
  temperature: 4.0
  alpha: 0.9              # weight on the soft (distillation) term
  teacher_checkpoint: "{results_dir}/teacher_{precision}_s{seed}/checkpoints/best.pt"
  teacher_arch: resnet18_cifar
  teacher_width_mult: 1.0

wandb:
  enabled: false
